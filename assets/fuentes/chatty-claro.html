<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0;padding:0}
html,body{width:600px;height:330px;background:#f7f6f3;overflow:hidden}
body{font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;color:#111111;-webkit-font-smoothing:antialiased;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.045) 1px,transparent 1px);background-size:48px 48px;
 -webkit-mask-image:radial-gradient(120% 100% at 30% 50%,#000 30%,transparent 85%)}
.glow{position:absolute;inset:0;background:radial-gradient(60% 90% at 28% 105%, rgba(250,76,3,.16), transparent 70%)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.ser{font-family:ui-serif,"New York",Georgia,serif;font-style:italic;font-weight:500}

body{background:transparent}
.card{position:absolute;inset:0;border-radius:18px;background:#ffffff;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.arte{height:150px;background:url('https://raw.githubusercontent.com/brunovareliuu/chatty/main/docs/imagenes/banner-en-claro.png') left center/cover no-repeat;border-bottom:1px solid rgba(0,0,0,.08)}
.txt{padding:18px 22px 0}
.fila{display:flex;align-items:center;gap:10px}
.nom{font-size:22px;font-weight:750;letter-spacing:-.02em}
.tag{font-size:10.5px;letter-spacing:.12em;padding:4px 8px;border-radius:99px;color:#fa4c03;background:rgba(0,0,0,.05);font-weight:600}
.desc{margin-top:7px;font-size:13.5px;line-height:1.45;color:rgba(17,17,17,.62);height:40px;overflow:hidden}
.pie{position:absolute;left:22px;right:22px;bottom:18px;display:flex;align-items:center;gap:6px}
.chip{font-size:11px;padding:4px 9px;border-radius:7px;background:rgba(0,0,0,.05);color:rgba(17,17,17,.62)}
.ir{margin-left:auto;font-size:12px;color:#111111;font-weight:600;white-space:nowrap} .ir b{color:#fa4c03}
</style></head><body><div class="card"><div class="arte"></div>
